<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(160deg, #0E1B2B 0%, #14243A 55%, #0E1B2B 100%);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .frame {
    position: relative;
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .mark {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
  }
  .mark .bars {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 58px;
  }
  .mark .bar { height: 10px; border-radius: 2px; }
  .mark .bar.blue   { width: 58px; background: #1B4F9C; }
  .mark .bar.red    { width: 48px; background: #E53E30; }
  .mark .bar.green  { width: 38px; background: #5CB85C; }
  .mark .bar.yellow { width: 29px; background: #F2C230; }
  .brand {
    color: #FFFFFF;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .tagline {
    margin-top: 18px;
    color: #B9C4D3;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.2px;
  }
  .divider {
    width: 64px;
    height: 3px;
    background: #4E8FE0;
    border-radius: 2px;
    margin: 40px 0;
  }
  .support {
    color: #4E8FE0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .chips {
    position: absolute;
    bottom: 84px;
    display: flex;
    gap: 14px;
  }
  .chip {
    padding: 12px 22px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    color: #D7DEE8;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .footer {
    position: absolute;
    bottom: 40px;
    color: #5C6C82;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="mark">
      <div class="bars">
        <div class="bar blue"></div>
        <div class="bar red"></div>
        <div class="bar green"></div>
        <div class="bar yellow"></div>
      </div>
    </div>
    <div class="brand">Gestorsoluções</div>
    <div class="tagline">Automação comercial para food service</div>
    <div class="divider"></div>
    <div class="support">Suporte rápido, de verdade.</div>
    <div class="chips">
      <div class="chip">Caixa</div>
      <div class="chip">Comanda</div>
      <div class="chip">Estoque</div>
      <div class="chip">Emissão fiscal</div>
    </div>
    <div class="footer">@gestorsolucoes</div>
  </div>
</body>
</html>
